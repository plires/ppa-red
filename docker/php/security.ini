; Hardening de PHP para la imagen de la app.
;
; session.upload_progress cierra una de las vías de php2shell (CVE-2026-109619)
; y es la única protección contra CVE-2026-115560 hasta que PHP publique el
; fix. La app no usa esta funcionalidad. Tiene que ir en un .ini: ini_set()
; en tiempo de ejecución no sirve.
session.upload_progress.enabled = Off
