; Variante de desarrollo de docker/supervisord.conf.
;
; La única diferencia es el worker de colas: acá corre `queue:listen` en vez de
; `queue:work`. En local el código está montado como volumen y el contenedor
; sobrevive días de ediciones, así que un `queue:work` — que bootea el framework
; UNA sola vez y se queda vivo — sigue sirviendo el código que había cuando
; arrancó. Los mails salen con la versión vieja aunque el archivo en disco ya
; esté corregido, y el síntoma es indistinguible de un bug.
;
; `queue:listen` rebootea el framework por cada job: más lento por job, algo que
; en local no se nota, pero nunca sirve código viejo.
;
; En producción no hace falta: el Dockerfile hornea el código con COPY, cada
; deploy levanta un contenedor nuevo y supervisord arranca un worker nuevo.

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0

[program:php-fpm]
command=php-fpm -F
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:queue]
command=php /var/www/html/artisan queue:listen --tries=3 --timeout=90
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
